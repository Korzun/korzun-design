name: Publish

on:
  push:
    tags: ['v*.*.*']

# npm trusted publishing: the job authenticates to npm with GitHub's OIDC token
# (`id-token: write`), so no npm token is stored in the repo. npm generates the
# provenance attestation automatically for OIDC publishes from a public repo.
# The trusted publisher (this repo, this workflow file name) is configured on
# npmjs.com under the package's Settings → Trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles a newer npm, this
      # step just makes the requirement explicit in the log.
      - run: npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run smoke
      - run: npm publish --access public
